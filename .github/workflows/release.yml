name: release

# Publish to PyPI when a v* tag is pushed (tag.yml creates the GitHub
# Release separately). `workflow_dispatch` allows manual re-runs.
# Note: release.published is NOT used because releases created by
# GITHUB_TOKEN do not trigger downstream workflows.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
