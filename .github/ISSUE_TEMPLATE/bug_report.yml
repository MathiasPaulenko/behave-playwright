name: Bug report
description: Report something that isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Expected vs. actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A minimal .feature file, step usage, or code snippet that shows the bug.
      render: gherkin
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: behave-playwright, playwright, python — e.g. "0.1.0 / 1.56 / 3.12"
      placeholder: "0.1.0 / 1.56 / 3.12"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Relevant behave output, error messages, or tracebacks.
      render: text
