<!doctype html>
<html>
<head>
  <title>Demo App</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; }
    label { display: block; margin: .5rem 0; }
    input { padding: .3rem; }
    button { padding: .35rem .9rem; cursor: pointer; }
    #error { color: #b00; }
    li { margin: .3rem 0; }
    li.done span { text-decoration: line-through; color: #888; }
  </style>
</head>
<body>
  <section id="login">
    <h1>Login</h1>
    <label>Email <input id="email" type="email"></label>
    <label>Password <input id="password" type="password"></label>
    <p id="error" hidden>Invalid credentials</p>
    <button id="signin">Sign in</button>
  </section>

  <section id="app" hidden>
    <h1>Welcome back</h1>
    <label>New todo <input id="new-todo" type="text"></label>
    <button id="add">Add</button>
    <ul id="todos"></ul>
    <p id="counter"><span id="count">0</span> items left</p>
  </section>

  <script>
    const DEFAULT_TODOS = ["Write tests", "Ship it"];
    const login = document.getElementById("login");
    const app = document.getElementById("app");
    const error = document.getElementById("error");
    const list = document.getElementById("todos");
    const count = document.getElementById("count");

    function render(todos) {
      list.innerHTML = "";
      todos.forEach((t) => addItem(t, false));
      updateCount();
    }

    function addItem(title, done) {
      const li = document.createElement("li");
      li.className = done ? "done" : "";
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = done;
      cb.onchange = () => { li.className = cb.checked ? "done" : ""; updateCount(); };
      const span = document.createElement("span");
      span.textContent = " " + title;
      const label = document.createElement("label");
      label.append(cb, span);
      li.append(label);
      list.append(li);
    }

    function updateCount() {
      count.textContent = list.querySelectorAll("input:not(:checked)").length;
    }

    document.getElementById("signin").onclick = () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      if (!email || !password) { error.hidden = false; return; }
      login.hidden = true;
      app.hidden = false;
      fetch("api/todos")
        .then((r) => r.json())
        .then(render)
        .catch(() => render(DEFAULT_TODOS));
    };

    document.getElementById("add").onclick = () => {
      const input = document.getElementById("new-todo");
      const title = input.value.trim();
      if (!title) return;
      addItem(title, false);
      input.value = "";
      updateCount();
    };
  </script>
</body>
</html>
